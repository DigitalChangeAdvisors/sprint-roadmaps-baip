<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{ --teal:#2e8b76; --teal-d:#236b5b; --oro:#a48111; --carbon:#1e2a38;
         --platino:#f3f3f3; --terra:#c2593f; --gris:#6b7280; }
  *{ box-sizing:border-box; }
  body{ font-family:'Montserrat','Helvetica Neue',Arial,sans-serif; color:var(--carbon);
        margin:0; background:#fafafa; font-size:14px; }
  header{ background:var(--carbon); color:#fff; padding:14px 22px; display:flex;
          align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  header .marca{ color:var(--oro); font-size:11px; letter-spacing:.14em; font-weight:700; }
  header h1{ font-family:Georgia,serif; font-weight:400; font-size:19px; margin:3px 0 0; }
  header .quien{ font-size:12px; color:rgba(255,255,255,.7); }
  .wrap{ max-width:900px; margin:0 auto; padding:18px 16px 60px; }
  .barra{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .barra input{ flex:1; min-width:180px; padding:9px 12px; border:1.5px solid #ddd; border-radius:8px; font-size:13px; }
  .btn{ border:none; border-radius:8px; padding:9px 16px; font-weight:700; font-size:13px;
        cursor:pointer; font-family:inherit; }
  .btn.p{ background:var(--teal); color:#fff; } .btn.p:hover{ background:var(--teal-d); }
  .btn.s{ background:#fff; color:var(--carbon); border:1.5px solid #ddd; } .btn.s:hover{ background:#f5f5f5; }
  .btn.g{ background:var(--oro); color:#fff; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .card{ background:#fff; border:1px solid #e7e7e7; border-radius:10px; margin-bottom:12px; overflow:hidden; }
  .card .head{ padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
               cursor:pointer; gap:10px; }
  .card .head:hover{ background:#fbfbfb; }
  .who{ font-weight:700; } .meta{ font-size:12px; color:var(--gris); margin-top:2px; }
  .pill{ font-size:11px; padding:3px 9px; border-radius:20px; font-weight:700; white-space:nowrap; }
  .pill.pend{ background:#fdf1ec; color:var(--terra); }
  .pill.done{ background:#eaf2ef; color:var(--teal-d); }
  .body{ display:none; padding:0 16px 16px; border-top:1px solid #f0f0f0; }
  .body.open{ display:block; }
  .campo{ margin-top:12px; }
  .campo .lbl{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--teal);
               font-weight:700; margin-bottom:3px; }
  .campo .val{ background:#fbfbfb; border:1px solid #eee; border-radius:6px; padding:8px 10px;
               white-space:pre-wrap; font-size:13px; line-height:1.5; }
  .evalbox{ margin-top:16px; background:var(--platino); border-radius:8px; padding:14px; }
  .evalbox h4{ margin:0 0 10px; color:var(--carbon); font-size:13px; }
  .crit{ display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .crit .ct{ flex:1; min-width:150px; font-size:13px; font-weight:600; }
  .crit select{ padding:5px 8px; border-radius:6px; border:1.5px solid #ddd; font-family:inherit; }
  .crit input.nota{ flex:2; min-width:160px; padding:6px 8px; border-radius:6px; border:1.5px solid #ddd;
                    font-family:inherit; font-size:12px; }
  textarea{ width:100%; margin-top:10px; min-height:120px; padding:10px; border:1.5px solid #ddd;
            border-radius:8px; font-family:inherit; font-size:13px; line-height:1.5; resize:vertical; }
  .mejlabel{ margin-top:16px; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
             color:var(--oro); font-weight:700; }
  .mejhint{ font-size:12px; color:var(--gris); margin:2px 0 0; }
  .mejora{ background:#fff; border:1px solid #e7e7e7; border-radius:8px; padding:10px; margin-top:10px; }
  .mejora-top{ display:flex; gap:8px; align-items:center; }
  .mejora .mfoco{ flex:1; padding:6px 8px; border-radius:6px; border:1.5px solid #ddd;
                  font-family:inherit; font-size:13px; font-weight:600; }
  .mejora .mpor{ width:100%; margin-top:8px; padding:6px 8px; border-radius:6px; border:1.5px solid #ddd;
                 font-family:inherit; font-size:12px; }
  .mejora textarea{ min-height:70px; margin-top:8px; }
  .mdel{ border:none; background:#f3f3f3; color:var(--terra); width:28px; height:28px; border-radius:6px;
         cursor:pointer; font-size:17px; line-height:1; flex-shrink:0; }
  .btn.addmej{ margin-top:10px; font-size:12px; padding:6px 12px; }
  .acciones{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .estado{ font-size:12px; color:var(--gris); }
  .estado.ok{ color:var(--teal-d); font-weight:700; }
  .estado.err{ color:var(--terra); font-weight:700; }
  .vacio{ text-align:center; color:var(--gris); padding:40px; }
  .spin{ display:inline-block; width:14px; height:14px; border:2px solid #ccc;
         border-top-color:var(--teal); border-radius:50%; animation:g .7s linear infinite; vertical-align:middle; }
  @keyframes g{ to{ transform:rotate(360deg); } }
  .pond{ margin:8px 0 2px; font-size:13px; font-weight:700; color:var(--oro); }
  .ver{ display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  .ver select{ padding:6px 10px; border-radius:6px; border:1.5px solid #ddd; font-family:inherit; font-weight:700; }
  .ianotas{ margin-top:12px; background:#fff; border:1px dashed var(--oro); border-radius:8px; padding:10px 12px; font-size:12px; line-height:1.55; }
  .ianotas b{ color:var(--carbon); }
  .ianotas .alerta{ color:var(--terra); font-weight:700; }
  .recib{ font-size:12px; color:var(--gris); margin-top:10px; }
  .pill.cons{ background:#eef3fb; color:#35507a; }
  .pill.flash{ background:#fbf3d9; color:#7a5f0a; }
  .fcrit{ display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .fcrit .ct{ flex:1; min-width:150px; font-size:13px; font-weight:600; }
  .fcrit select{ padding:5px 8px; border-radius:6px; border:1.5px solid #ddd; font-family:inherit; }
  .fcrit input.nota{ flex:2; min-width:160px; padding:6px 8px; border-radius:6px; border:1.5px solid #ddd; font-family:inherit; font-size:12px; }
</style>
</head>
<body>
<header>
  <div>
    <div class="marca">DIGITAL CHANGE ACADEMY · DCA</div>
    <h1>Panel de Facilitador</h1>
  </div>
  <div class="quien">Sesión: <?= email ?></div>
</header>

<div class="wrap">
  <div class="barra">
    <input id="filtro" placeholder="Filtrar por nombre, empresa, cohorte o experimento…" oninput="render()">
    <button class="btn s" onclick="cargar()">↻ Actualizar</button>
  </div>
  <div id="lista"><div class="vacio"><span class="spin"></span> Cargando entregas…</div></div>
</div>

<script>
  var RUBRICA = <?!= JSON.stringify(rubrica) ?>;
  var TOKEN = <?!= JSON.stringify(token) ?>;
  var ENTREGAS = [];

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escA(s){ return esc(s).replace(/"/g,'&quot;'); }

  function mejoraRowHtml(m){
    m = m || {};
    return '<div class="mejora">'
      + '<div class="mejora-top">'
      +   '<input class="mfoco" placeholder="Aspecto a mejorar (p. ej. Cuantificar la línea base)" value="'+escA(m.foco||'')+'">'
      +   '<button type="button" class="mdel" title="Quitar" onclick="this.closest(\'.mejora\').remove()">×</button>'
      + '</div>'
      + '<textarea class="mejem" placeholder="Ejemplo modelo: así se vería más fuerte…">'+esc(m.ejemplo||'')+'</textarea>'
      + '<input class="mpor" placeholder="Por qué funciona (una frase, opcional)" value="'+escA(m.porque||'')+'">'
      + '</div>';
  }

  function cargar(){
    document.getElementById('lista').innerHTML = '<div class="vacio"><span class="spin"></span> Cargando…</div>';
    google.script.run
      .withSuccessHandler(function(res){ ENTREGAS = res.entregas || []; render(); })
      .withFailureHandler(function(err){
        document.getElementById('lista').innerHTML = '<div class="vacio" style="color:#c2593f">'+esc(err.message||err)+'</div>';
      })
      .listarEntregas(TOKEN);
  }

  function render(){
    var q = (document.getElementById('filtro').value||'').toLowerCase();
    var arr = ENTREGAS.filter(function(e){
      return !q || (e.nombre+' '+e.empresa+' '+e.cohorte+' '+e.experimento+' '+e.recibo).toLowerCase().indexOf(q)!==-1;
    });
    var cont = document.getElementById('lista');
    if(!arr.length){ cont.innerHTML = '<div class="vacio">No hay entregas'+(q?' que coincidan con el filtro.':' todavía.')+'</div>'; return; }
    cont.innerHTML = arr.map(tarjeta).join('');
    arr.forEach(function(e){ if(e.esCierre) recalc(e.recibo); });
  }

  function tarjeta(e){
    var enviado = !!e.feedbackEnviadoEn;
    var pill = enviado
      ? '<span class="pill done">✓ Feedback enviado</span>'
      : '<span class="pill pend">Pendiente</span>';
    var campos = e.campos.map(function(c){
      return '<div class="campo"><div class="lbl">'+esc(c.etq)+'</div><div class="val">'+esc(c.val)+'</div></div>';
    }).join('');

    var mejHtml = (e.mejorasGuardadas||[]).map(mejoraRowHtml).join('');

    var R = e.rubrica || RUBRICA;
    var crit = R.map(function(r){
      var saved = null;
      if(e.rubricaGuardada){ saved = e.rubricaGuardada.find(function(x){return x.clave===r.clave;}); }
      var pv = saved ? saved.puntaje : 3;
      var nv = saved ? saved.nota : '';
      var opts = [1,2,3,4,5].map(function(n){ return '<option value="'+n+'"'+(n===pv?' selected':'')+'>'+n+'/5</option>'; }).join('');
      return '<div class="crit" data-clave="'+r.clave+'">'
        + '<span class="ct">'+esc(r.titulo)+(r.peso?' <span style="color:#6b7280;font-weight:400">('+r.peso+'%)</span>':'')+'</span>'
        + '<select class="pj" onchange="recalc(\''+e.recibo+'\')">'+opts+'</select>'
        + '<input class="nota" placeholder="Nota breve (opcional)" value="'+esc(nv)+'">'
        + '</div>';
    }).join('');

    var pillTxt = enviado ? '<span class="pill done">✓ '+(e.esConsulta?'Respondida':(e.veredicto?('Resultado: '+esc(String(e.veredicto).replace('_',' '))):'Feedback enviado'))+'</span>'
                          : '<span class="pill pend">Pendiente</span>';
    if(e.esConsulta){ pillTxt = enviado ? '<span class="pill done">✓ Respondida</span>' : '<span class="pill cons">Consulta por responder</span>'; }
    if(e.esFlash){ pillTxt = enviado ? '<span class="pill done">⚡ Flash enviado</span>' : '<span class="pill flash">⚡ Flash por enviar</span>'; }
    var cuerpoEval = evalHtml(e, enviado, crit, mejHtml);
    return ''
    + '<div class="card" id="card-'+e.recibo+'">'
    +   '<div class="head" onclick="toggle(\''+e.recibo+'\')">'
    +     '<div><div class="who">'+esc(e.nombre)+' · <span style="color:#6b7280;font-weight:400">'+esc(e.experimento)+'</span></div>'
    +       '<div class="meta">'+esc(e.empresa)+' · '+esc(e.cohorte)+' · '+esc(e.email)+' · '+esc(e.fecha)+' · Recibo '+esc(e.recibo)+'</div></div>'
    +     pillTxt
    +   '</div>'
    +   '<div class="body" id="body-'+e.recibo+'">'
    +     campos
    +     (enviado ? '<div class="campo"><div class="lbl">Feedback ya enviado ('+esc(e.feedbackEnviadoEn)+' · '+esc(e.feedbackPor)+')</div></div>' : '')
    +     cuerpoEval
    +   '</div>'
    + '</div>';
  }

  function evalHtml(e, enviado, crit, mejHtml){
    if(e.esConsulta){
      return '<div class="evalbox"><h4>Responder consulta</h4>'
        + '<p class="mejhint">La respuesta le llega al estudiante por correo (responder-a: facilitador). Las respuestas de interés general puedes publicarlas, anonimizadas, en el Centro de Ayuda.</p>'
        + '<textarea id="resp-'+e.recibo+'" placeholder="Tu respuesta (tuteo)…">'+esc(e.feedbackTexto)+'</textarea>'
        + '<div class="acciones"><button class="btn p" onclick="responder(\''+e.recibo+'\')">✉ '+(enviado?'Enviar otra respuesta':'Responder consulta')+'</button>'
        + '<span class="estado" id="est-'+e.recibo+'"></span></div></div>';
    }
    if(e.esFlash){
      var NIV = [['','— elige —'],['buen_camino','En buen camino'],['ajustar','Ajustar'],['replantear','Replantear']];
      var saved = e.rubricaGuardada || [];
      var frows = (e.criteriosFlash||[]).map(function(c){
        var sv = saved.find ? saved.find(function(x){return x.clave===c.clave;}) : null;
        var opts = NIV.map(function(n){ return '<option value="'+n[0]+'"'+((sv&&sv.nivel===n[0])?' selected':'')+'>'+n[1]+'</option>'; }).join('');
        return '<div class="fcrit" data-clave="'+c.clave+'"><span class="ct">'+esc(c.titulo)+'</span><select class="fn">'+opts+'</select>'
          + '<input class="nota" placeholder="Orientación breve (opcional)" value="'+escA(sv?sv.nota:'')+'"></div>';
      }).join('');
      return '<div class="evalbox"><h4>⚡ Flash Feedback · orientación breve (no califica)</h4>'
        + '<p class="mejhint">Un comentario corto y un nivel por criterio para orientar el siguiente entregable. La calificación se emite una sola vez, en el cierre.</p>'
        + frows
        + '<div class="ianotas" id="ia-'+e.recibo+'" style="display:none"></div>'
        + '<textarea id="txt-'+e.recibo+'" style="min-height:90px" placeholder="Flash Feedback para el estudiante (tuteo, máximo 5 frases)…">'+esc(e.feedbackTexto)+'</textarea>'
        + '<div class="mejlabel">Una mejora concreta (opcional)</div>'
        + '<div class="mejoras" id="mej-'+e.recibo+'">'+mejHtml+'</div>'
        + '<button type="button" class="btn s addmej" onclick="addMejora(\''+e.recibo+'\')">+ Añadir ejemplo</button>'
        + '<div class="acciones"><button class="btn g" onclick="borrador(\''+e.recibo+'\')">✨ Generar Flash con IA</button>'
        + '<button class="btn p" onclick="enviarFlash(\''+e.recibo+'\')">⚡ '+(enviado?'Reenviar Flash Feedback':'Enviar Flash Feedback')+'</button>'
        + '<span class="estado" id="est-'+e.recibo+'"></span></div></div>';
    }
    if(e.esAudicion && !e.esCierre){
      return '<div class="evalbox"><h4>Evaluación</h4><p class="mejhint">La audición se evalúa en la entrega de <b>Cierre</b> (905), que reúne los cuatro entregables más recientes del estudiante.</p></div>';
    }
    var extra = '', recibidos = '';
    if(e.esCierre){
      var lista = ['901','902','903','904','905'].map(function(k){
        var ok = ENTREGAS.some(function(x){ return x.instrumento===e.instrumento && x.email===e.email && x.exp===k; });
        return '<span style="margin-right:8px;color:'+(ok?'#236b5b':'#c2593f')+'">'+k+(ok?' ✓':' ✗')+'</span>';
      }).join('');
      recibidos = '<div class="recib">Entregables recibidos: '+lista+'</div>';
      var VL = {'':'— elige —','aprobado':'Aprobado (certificación)','ajustes':'Requiere ajustes (semana 3)','no_aprobado':'No aprobado'};
      var vs = ['','aprobado','ajustes','no_aprobado'].map(function(v){ return '<option value="'+v+'"'+(v===(e.veredicto||'')?' selected':'')+'>'+VL[v]+'</option>'; }).join('');
      extra = '<div class="pond" id="pond-'+e.recibo+'"></div>'
        + '<div class="ver"><b>Veredicto:</b><select id="ver-'+e.recibo+'">'+vs+'</select>'
        + '<span class="mejhint">Sin «aprobado condicional»: para aprobar, los siete criterios deben tener 3 o más. «Ajustes»: la estudiante los hace en la semana 3 y tú emites el veredicto final.</span></div>'
        + '<div class="ianotas" id="ia-'+e.recibo+'" style="display:none"></div>';
    }
    return '<div class="evalbox">'
      + '<h4>Evaluación con rúbrica'+(e.esCierre?' · 7 criterios ponderados':'')+'</h4>'
      + recibidos + crit + extra
      + '<textarea id="txt-'+e.recibo+'" placeholder="Comentario de feedback para el estudiante (tuteo)…">'+esc(e.feedbackTexto)+'</textarea>'
      + '<div class="mejlabel">Guía de mejora · ejemplos concretos para el estudiante</div>'
      + '<p class="mejhint">Por cada punto débil, un ejemplo modelo del «así se vería más fuerte». Edita, añade o quita los que quieras.</p>'
      + '<div class="mejoras" id="mej-'+e.recibo+'">'+mejHtml+'</div>'
      + '<button type="button" class="btn s addmej" onclick="addMejora(\''+e.recibo+'\')">+ Añadir ejemplo</button>'
      + '<div class="acciones">'
      +   '<button class="btn g" onclick="borrador(\''+e.recibo+'\')">✨ Generar borrador con IA</button>'
      +   '<button class="btn p" onclick="enviar(\''+e.recibo+'\')">✉ '+(enviado?'Reenviar resultado':(e.esCierre?'Enviar resultado':'Enviar feedback'))+'</button>'
      +   '<span class="estado" id="est-'+e.recibo+'"></span>'
      + '</div></div>';
  }

  function pesosDe(r){
    var out = {};
    document.querySelectorAll('#card-'+r+' .crit').forEach(function(row){
      var t = row.querySelector('.ct').textContent;
      var m = t.match(/\((\d+)%\)/);
      out[row.getAttribute('data-clave')] = m ? parseInt(m[1],10) : 0;
    });
    return out;
  }
  function recalc(r){
    var el = document.getElementById('pond-'+r); if(!el) return;
    var pesos = pesosDe(r), pct = 0, bajos = [];
    document.querySelectorAll('#card-'+r+' .crit').forEach(function(row){
      var cl = row.getAttribute('data-clave'), pj = parseInt(row.querySelector('.pj').value,10);
      pct += (pesos[cl]||0) * (pj/5);
      if(pj<=2) bajos.push(row.querySelector('.ct').textContent.replace(/\(\d+%\)/,'').trim());
    });
    el.innerHTML = 'Puntaje ponderado: '+(Math.round(pct*10)/10)+'%'
      + (bajos.length ? ' · <span style="color:#c2593f">Criterios en nivel insuficiente: '+bajos.map(esc).join('; ')+'</span>' : '');
  }
  function responder(r){
    var texto = document.getElementById('resp-'+r).value.trim();
    if(!texto){ estado(r,'⚠ Escribe la respuesta antes de enviar.','err'); return; }
    if(!confirm('¿Enviar esta respuesta al estudiante por correo?')) return;
    estado(r,'<span class="spin"></span> Enviando…');
    google.script.run
      .withSuccessHandler(function(res){
        estado(r,'✓ Enviada a '+esc(res.destinatario)+' ('+esc(res.enviadoEn)+')','ok');
        var pill = document.querySelector('#card-'+r+' .pill'); pill.className='pill done'; pill.textContent='✓ Respondida';
      })
      .withFailureHandler(function(err){ estado(r,'⚠ '+esc(err.message||err),'err'); })
      .responderConsulta(TOKEN, { recibo:r, respuesta:texto });
  }

  function toggle(r){ document.getElementById('body-'+r).classList.toggle('open'); }

  function leerCrit(r){
    var out = [];
    document.querySelectorAll('#card-'+r+' .crit').forEach(function(row){
      out.push({ clave: row.getAttribute('data-clave'),
                 puntaje: parseInt(row.querySelector('.pj').value,10),
                 nota: row.querySelector('.nota').value });
    });
    return out;
  }
  function estado(r, html, cls){ var el=document.getElementById('est-'+r); el.className='estado '+(cls||''); el.innerHTML=html; }

  function addMejora(r){
    var cont = document.getElementById('mej-'+r);
    var tmp = document.createElement('div');
    tmp.innerHTML = mejoraRowHtml({});
    cont.appendChild(tmp.firstChild);
  }
  function leerMejoras(r){
    var out = [];
    document.querySelectorAll('#card-'+r+' .mejora').forEach(function(row){
      var foco = row.querySelector('.mfoco').value.trim();
      var ejemplo = row.querySelector('.mejem').value.trim();
      var porque = row.querySelector('.mpor').value.trim();
      if(foco || ejemplo){ out.push({ foco:foco, ejemplo:ejemplo, porque:porque }); }
    });
    return out;
  }

  function borrador(r){
    estado(r, '<span class="spin"></span> La IA está redactando el borrador…');
    google.script.run
      .withSuccessHandler(function(res){
        if(res.flash){
          document.getElementById('txt-'+r).value = res.comentario || '';
          (res.indicadores||[]).forEach(function(c){
            var row = document.querySelector('#card-'+r+' .fcrit[data-clave="'+c.clave+'"]');
            if(row){ row.querySelector('.fn').value = c.nivel; row.querySelector('.nota').value = c.nota||''; }
          });
          document.getElementById('mej-'+r).innerHTML = (res.mejoras||[]).map(mejoraRowHtml).join('');
          var iaf = document.getElementById('ia-'+r);
          if(iaf && (res.alertas||[]).length){
            iaf.innerHTML = '<b>Alertas de la IA para ti (no se envían)</b><br>'+res.alertas.map(function(a){ return '<span class="alerta">⚠ '+esc(a)+'</span>'; }).join('<br>');
            iaf.style.display = 'block';
          }
          estado(r, '✓ Flash listo — revísalo y ajústalo antes de enviar.', 'ok');
          return;
        }
        document.getElementById('txt-'+r).value = res.comentario || '';
        (res.criterios||[]).forEach(function(c){
          var row = document.querySelector('#card-'+r+' .crit[data-clave="'+c.clave+'"]');
          if(row){ row.querySelector('.pj').value = c.puntaje; row.querySelector('.nota').value = c.nota||''; }
        });
        document.getElementById('mej-'+r).innerHTML = (res.mejoras||[]).map(mejoraRowHtml).join('');
        var vsel = document.getElementById('ver-'+r);
        if(vsel && res.veredicto){ vsel.value = res.veredicto; }
        var ia = document.getElementById('ia-'+r);
        if(ia && (res.errores||res.exclusion||res.alertas)){
          var h = '<b>Notas de la IA para ti (no se envían al estudiante)</b><br>';
          if(res.exclusion){ h += '<b>Regla de exclusión:</b> '+(res.exclusion.activada?'<span class="alerta">ACTIVADA</span>':'no activada')+' — '+esc(res.exclusion.motivo||'')+'<br>'; }
          if((res.errores||[]).length){ h += '<b>Errores del borrador:</b><br>'+res.errores.map(function(x){ return '· Error '+x.numero+': '+esc(x.estado)+' — '+esc(x.nota); }).join('<br>')+'<br>'; }
          if((res.alertas||[]).length){ h += '<b>Alertas:</b><br>'+res.alertas.map(function(a){ return '<span class="alerta">⚠ '+esc(a)+'</span>'; }).join('<br>'); }
          ia.innerHTML = h; ia.style.display = 'block';
        }
        recalc(r);
        estado(r, '✓ Borrador listo — revísalo, ajústalo y decide tú el veredicto antes de enviar.', 'ok');
      })
      .withFailureHandler(function(err){ estado(r, '⚠ '+esc(err.message||err), 'err'); })
      .generarBorradorIA(TOKEN, r);
  }

  function enviarFlash(r){
    var comentario = document.getElementById('txt-'+r).value.trim();
    if(!comentario){ estado(r, '⚠ Escribe o genera el Flash Feedback antes de enviar.', 'err'); return; }
    var ind = [];
    document.querySelectorAll('#card-'+r+' .fcrit').forEach(function(row){
      ind.push({ clave: row.getAttribute('data-clave'), nivel: row.querySelector('.fn').value, nota: row.querySelector('.nota').value });
    });
    if(ind.some(function(i){ return !i.nivel; })){ estado(r, '⚠ Elige un nivel para cada criterio.', 'err'); return; }
    if(!confirm('¿Enviar este Flash Feedback al estudiante por correo?')) return;
    estado(r, '<span class="spin"></span> Enviando…');
    google.script.run
      .withSuccessHandler(function(res){
        estado(r, '✓ Flash enviado a '+esc(res.destinatario)+' ('+esc(res.enviadoEn)+')', 'ok');
        var pill = document.querySelector('#card-'+r+' .pill'); pill.className='pill done'; pill.textContent='⚡ Flash enviado';
      })
      .withFailureHandler(function(err){ estado(r, '⚠ '+esc(err.message||err), 'err'); })
      .enviarFeedback(TOKEN, { recibo:r, comentario:comentario, indicadores:ind, mejoras:leerMejoras(r) });
  }

  function enviar(r){
    var comentario = document.getElementById('txt-'+r).value.trim();
    if(!comentario){ estado(r, '⚠ Escribe o genera un comentario antes de enviar.', 'err'); return; }
    if(!confirm('¿Enviar este feedback al estudiante por correo?')) return;
    estado(r, '<span class="spin"></span> Enviando…');
    google.script.run
      .withSuccessHandler(function(res){
        estado(r, '✓ Enviado a '+esc(res.destinatario)+' ('+esc(res.enviadoEn)+')', 'ok');
        var card = document.getElementById('card-'+r);
        var pill = card.querySelector('.pill');
        pill.className = 'pill done'; pill.textContent = '✓ Feedback enviado';
      })
      .withFailureHandler(function(err){ estado(r, '⚠ '+esc(err.message||err), 'err'); })
      .enviarFeedback(TOKEN, { recibo: r, comentario: comentario, criterios: leerCrit(r), mejoras: leerMejoras(r),
                               veredicto: (document.getElementById('ver-'+r)||{}).value || '' });
  }

  cargar();
</script>
</body>
</html>
